<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yellow Kitchen</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="flex-card">
          <div class="header-logo">
            <img src="/images/header-logo/Logo.png" alt="header-logo" />
          </div>
          <nav>
            <ul class="nav-item">
              <li class="nav-items">
                <a href="#"
                  ><i class="fa-solid fa-user"></i>
                  <p>Login</p></a
                >
              </li>

              <li class="nav-items">
                <a href="#">
                  <i class="fa-solid fa-cart-shopping"></i>
                  <p>0</p>
                </a>
              </li>
              <button class="button">
                <i class="fa-solid fa-bars"></i>
              </button>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <!--headerning tugashi-->

    <!--mainning boshlanishi-->
    <section class="main-section">
      <div class="main-hero">
        <div class="main-content">
          <div class="main-data">
            <h1>
              Your Food court
              <br />
              at home
            </h1>
          </div>
          <div class="main-block">
            <div class="main-items">
              <h5>Delivery</h5>
              <p>Order in</p>
            </div>
            <div class="main-items">
              <h5>Takeout</h5>
              <p>Grab and go</p>
            </div>
          </div>
        </div>
        <div class="main-images">
          <img src="/images/main-img/salat.png" alt="food-img" />
        </div>
      </div>
    </section>
    <!--main qisminig tugashi-->

    <!--banner qismining boshi-->
    <div class="banner">
      <span>
        <img src="/images/banner/Page 1.png" alt="banner-image" />
        <p>
          delivery in all paris
          <br />
          in less than 30 minutes
        </p>
      </span>
      <span>
        <img src="/images/banner/delivery.png" alt="delivery-image" />
        <p>
          Free delivery
          <br />
          from 29 euros
        </p>
      </span>
      <span>
        <img src="/images/banner/paris.png" alt="paris-image" />
        <p>
          Only fresh
          <br />
          and French products
        </p>
      </span>
    </div>
    <!--bannerning tugashi-->

    <!--mahsulotlar sahifaning boshi-->
    <section class="section-main">
      <div class="conteiner">
        <div class="container-main">
          <div class="container-text">
            <h2>Restaurants</h2>
          </div>
          <button>show all</button>
        </div>
      </div>

      <div class="swiper resSwiper">
        <div class="swiper-wrapper">
          
          
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </section>
    <!--mahsulotlar sahifaning tugshi-->

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/swiper.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
